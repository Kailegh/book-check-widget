<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Bibliotecas de Madrid</title>
  <link rel="stylesheet" href="../../dist/ui.css" />
</head>
<body class="w-72 bg-white p-4 text-slate-800">
  <h1 class="text-sm font-semibold">Disponibilidad en Madrid</h1>

  <button id="scan" class="mt-3 w-full rounded bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:bg-slate-300">
    Comprobar esta página
  </button>
  <p id="status" class="mt-2 text-xs text-slate-600"></p>

  <ul class="mt-3 space-y-1 border-t border-slate-200 pt-3 text-xs">
    <li class="flex items-center gap-2"><span class="size-2.5 rounded-full bg-emerald-500"></span>En tus bibliotecas</li>
    <li class="flex items-center gap-2"><span class="size-2.5 rounded-full bg-amber-400"></span>En otras bibliotecas</li>
    <li class="flex items-center gap-2"><span class="size-2.5 rounded-full bg-rose-500"></span>No disponible ahora</li>
  </ul>

  <div class="mt-3 flex gap-2 border-t border-slate-200 pt-3">
    <button id="options" class="flex-1 rounded border border-slate-300 px-2 py-1 text-xs hover:bg-slate-50">Bibliotecas</button>
    <button id="clear" class="flex-1 rounded border border-slate-300 px-2 py-1 text-xs hover:bg-slate-50">Vaciar caché</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
